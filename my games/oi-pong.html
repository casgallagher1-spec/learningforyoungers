<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OI PONG 🏓</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at top, #281036, #090912 55%, #020207);
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

.hidden {
  display: none !important;
}

/* =========================
   MAIN MENU
========================= */

.menu {
  width: min(650px, 92vw);
  text-align: center;
  padding: 45px 30px;
  background: rgba(8, 8, 18, 0.88);
  border: 2px solid #35152b;
  border-radius: 24px;
  box-shadow:
    0 0 60px rgba(255, 23, 68, 0.16),
    inset 0 0 50px rgba(0, 0, 0, 0.5);
}

.logo {
  font-size: clamp(4rem, 12vw, 7rem);
  font-weight: 900;
  letter-spacing: 10px;
  text-shadow:
    0 0 10px #00eaff,
    0 0 30px #00eaff,
    0 0 60px #00eaff;
  margin-bottom: 5px;
}

.tagline {
  color: #ff1744;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 35px;
}

.menu-buttons {
  display: flex;
  flex-direction: column;
  gap: 13px;
  max-width: 380px;
  margin: auto;
}

button,
select {
  font-family: inherit;
}

.menu-btn {
  border: 2px solid #303049;
  border-radius: 10px;
  padding: 15px;
  background: #11111d;
  color: white;
  font-size: 1.05rem;
  font-weight: bold;
  cursor: pointer;
  transition: 0.15s;
}

.menu-btn:hover {
  transform: translateY(-2px);
  border-color: #00eaff;
  box-shadow: 0 0 20px rgba(0, 234, 255, 0.25);
}

.primary {
  background: linear-gradient(135deg, #00bcd4, #006eff);
  border-color: #00eaff;
}

.danger {
  color: #ff5478;
}

.menu-section {
  margin-top: 25px;
  color: #88889d;
  font-size: 0.85rem;
}

select {
  margin-top: 10px;
  width: 100%;
  padding: 11px;
  background: #11111d;
  color: white;
  border: 2px solid #ff1744;
  border-radius: 8px;
  cursor: pointer;
  outline: none;
  font-weight: bold;
}

/* =========================
   GAME
========================= */

.game-wrap {
  width: min(1050px, 95vw);
  text-align: center;
}

.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.game-title {
  font-size: 1.2rem;
  font-weight: bold;
  color: #ff5478;
}

.top-buttons {
  display: flex;
  gap: 8px;
}

.small-btn {
  padding: 7px 12px;
  border-radius: 7px;
  border: 1px solid #38384d;
  background: #11111d;
  color: white;
  cursor: pointer;
}

.small-btn:hover {
  border-color: #00eaff;
}

canvas {
  width: 100%;
  aspect-ratio: 16 / 9;
  display: block;
  background: #06060d;
  border: 2px solid #351426;
  border-radius: 16px;
  box-shadow:
    0 0 35px rgba(255, 23, 68, 0.2),
    inset 0 0 50px rgba(0, 0, 0, 0.7);
  cursor: pointer;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 22px;
  flex-wrap: wrap;
  margin-top: 13px;
  color: #88889c;
  font-size: 0.8rem;
}

kbd {
  padding: 4px 8px;
  border: 1px solid #38384d;
  border-radius: 5px;
  background: #12121d;
  color: white;
  box-shadow: 0 2px 0 #000;
}

#message {
  height: 28px;
  margin-top: 9px;
  color: #ff1744;
  font-weight: bold;
  text-shadow: 0 0 10px #ff1744;
}

@media (max-width: 600px) {
  .menu {
    padding: 30px 20px;
  }

  .controls {
    gap: 10px;
  }
}
</style>
</head>

<body>
<a href="index.html" style="
position:fixed;
top:15px;
right:15px;
z-index:9999;
padding:12px 20px;
border-radius:14px;
background:linear-gradient(135deg,#5865f2,#a855f7);
color:white;
text-decoration:none;
font:bold 14px Arial;
letter-spacing:1.5px;
border:2px solid rgba(255,255,255,.3);
box-shadow:0 5px 0 #3b3f9e,0 8px 18px rgba(0,0,0,.35);
transition:.15s;
" onmouseover="this.style.transform='translateY(-2px)';this.style.filter='brightness(1.2)'"
onmouseout="this.style.transform='';this.style.filter=''"
>
⌂ HOME
</a>
<!-- =========================
     MAIN MENU
========================= -->

<div id="menu" class="menu">

  <div class="logo">PONG</div>

  <div class="tagline">
    OI GET OFF MY BLOCK 💀
  </div>

  <div class="menu-buttons">

    <button
      class="menu-btn primary"
      id="aiButton">
      🤖 PLAYER VS AI
    </button>

    <button
      class="menu-btn"
      id="pvpButton">
      👊 PLAYER VS PLAYER
    </button>

    <button
      class="menu-btn danger"
      id="quitButton">
      ❌ QUIT
    </button>

  </div>

  <div class="menu-section" id="difficultySection">

    AI DIFFICULTY

    <select id="aiLevel">

      <option value="easy">
        😴 Easy
      </option>

      <option value="medium" selected>
        😎 Medium
      </option>

      <option value="hard">
        😈 Hard
      </option>

      <option value="block">
        💀 OI GET OFF MY BLOCK
      </option>

    </select>

  </div>

  <div class="menu-section">
    First player to 7 wins.
  </div>

</div>


<!-- =========================
     GAME
========================= -->

<div id="gameScreen" class="game-wrap hidden">

  <div class="game-header">

    <div
      id="gameTitle"
      class="game-title">
      PONG
    </div>

    <div class="top-buttons">

      <button
        class="small-btn"
        id="restartButton">
        ↻ Restart
      </button>

      <button
        class="small-btn"
        id="menuButton">
        ☰ Menu
      </button>

    </div>

  </div>

  <canvas
    id="game"
    width="1000"
    height="560">
  </canvas>

  <div class="controls">

    <span>
      <kbd>W</kbd> / <kbd>S</kbd>
      Player 1
    </span>

    <span id="p2Controls">
      <kbd>↑</kbd> / <kbd>↓</kbd>
      Player 2
    </span>

    <span>
      <kbd>SPACE</kbd> Start
    </span>

  </div>

  <div id="message">
    Press SPACE to start, bruv.
  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const menu =
  document.getElementById("menu");

const gameScreen =
  document.getElementById("gameScreen");

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const message =
  document.getElementById("message");

const gameTitle =
  document.getElementById("gameTitle");

const aiLevel =
  document.getElementById("aiLevel");

const difficultySection =
  document.getElementById("difficultySection");

const p2Controls =
  document.getElementById("p2Controls");

const W = canvas.width;
const H = canvas.height;

const WINNING_SCORE = 7;


/* =========================
   GAME STATE
========================= */

let gameMode = "ai";
let running = false;
let gameOver = false;

let keys = {};


/* =========================
   PADDLES
========================= */

const paddle = {
  width: 18,
  height: 110,
  speed: 9
};

const player1 = {
  x: 35,
  y: H / 2 - paddle.height / 2,
  score: 0
};

const player2 = {
  x: W - 53,
  y: H / 2 - paddle.height / 2,
  score: 0
};


/* =========================
   BALL
========================= */

const ball = {
  x: W / 2,
  y: H / 2,
  radius: 9,
  speed: 7,
  vx: 7,
  vy: 3
};


/* =========================
   DIFFICULTIES
========================= */

const difficulties = {

  easy: {
    name: "EASY 😴",
    colour: "#00eaff",
    speed: 5,
    reaction: 0.45,
    prediction: 2
  },

  medium: {
    name: "MEDIUM 😎",
    colour: "#ffd43b",
    speed: 7,
    reaction: 0.7,
    prediction: 4
  },

  hard: {
    name: "HARD 😈",
    colour: "#ff7b00",
    speed: 9.5,
    reaction: 0.9,
    prediction: 6
  },

  block: {
    name: "OI GET OFF MY BLOCK 💀",
    colour: "#ff1744",
    speed: 14,
    reaction: 1,
    prediction: 10
  }

};


/* =========================
   MENU
========================= */

document
  .getElementById("aiButton")
  .addEventListener("click", () => {

    gameMode = "ai";

    startGame();
  });


document
  .getElementById("pvpButton")
  .addEventListener("click", () => {

    gameMode = "pvp";

    startGame();
  });


/* =========================
   START GAME
========================= */

function startGame() {

  menu.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  if (gameMode === "ai") {

    gameTitle.textContent =
      "🤖 PLAYER VS AI";

    p2Controls.innerHTML =
      '<span><strong>AI</strong> — good luck, bruv 💀</span>';

  } else {

    gameTitle.textContent =
      "👊 PLAYER VS PLAYER";

    p2Controls.innerHTML =
      '<kbd>↑</kbd> / <kbd>↓</kbd> Player 2';
  }

  resetGame();
}


/* =========================
   RETURN TO MENU
========================= */

document
  .getElementById("menuButton")
  .addEventListener("click", () => {

    running = false;
    gameOver = false;

    gameScreen.classList.add("hidden");
    menu.classList.remove("hidden");

  });


/* =========================
   RESTART
========================= */

document
  .getElementById("restartButton")
  .addEventListener("click", () => {

    resetGame();

    running = true;

    message.textContent =
      "RIGHT, RUN IT BACK BRUV.";
  });


/* =========================
   QUIT
========================= */

document
  .getElementById("quitButton")
  .addEventListener("click", () => {

    /*
      Browsers usually block JavaScript
      from closing tabs it didn't open.
      So we'll just give the user
      a proper message.
    */

    alert(
      "OI BRUV, YOU CAN'T ESCAPE THE BLOCK THAT EASILY. 💀"
    );

  });


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  e => {

    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {

      e.preventDefault();

      if (gameOver) {
        resetGame();
      }

      running = true;

      message.textContent =
        "COME ON THEN, BRUV.";
    }

    if (
      e.key.toLowerCase() === "r"
    ) {

      if (
        !gameScreen.classList.contains(
          "hidden"
        )
      ) {

        resetGame();
      }
    }

  }
);


document.addEventListener(
  "keyup",
  e => {

    keys[e.key.toLowerCase()] = false;

  }
);


/* =========================
   CLICK CANVAS
========================= */

canvas.addEventListener(
  "click",
  () => {

    if (gameOver) {
      resetGame();
    }

    running = true;

    message.textContent =
      "COME ON THEN, HAVE A GO.";

  }
);


/* =========================
   RESET BALL
========================= */

function resetBall(direction) {

  if (!direction) {
    direction =
      Math.random() > 0.5
        ? 1
        : -1;
  }

  ball.x = W / 2;
  ball.y = H / 2;

  ball.speed = 7;

  const angle =
    Math.random() * 0.9 - 0.45;

  ball.vx =
    ball.speed * direction;

  ball.vy =
    ball.speed * angle;
}


/* =========================
   RESET GAME
========================= */

function resetGame() {

  player1.score = 0;
  player2.score = 0;

  player1.y =
    H / 2 -
    paddle.height / 2;

  player2.y =
    H / 2 -
    paddle.height / 2;

  gameOver = false;
  running = false;

  resetBall();

  message.textContent =
    "Press SPACE to start, bruv.";
}


/* =========================
   UPDATE
========================= */

function update() {

  if (!running || gameOver) {
    return;
  }


  /* =========================
     PLAYER 1
  ========================= */

  if (keys["w"]) {
    player1.y -= paddle.speed;
  }

  if (keys["s"]) {
    player1.y += paddle.speed;
  }


  /* =========================
     PLAYER 2
  ========================= */

  if (gameMode === "pvp") {

    if (keys["arrowup"]) {
      player2.y -= paddle.speed;
    }

    if (keys["arrowdown"]) {
      player2.y += paddle.speed;
    }

  }


  /* =========================
     AI
  ========================= */

  if (gameMode === "ai") {

    const level =
      difficulties[aiLevel.value];

    const cpuCentre =
      player2.y +
      paddle.height / 2;

    let targetY =
      ball.y +
      ball.vy *
      level.prediction;

    /*
      Make easy mode less accurate.
    */

    if (
      aiLevel.value === "easy" &&
      Math.random() < 0.025
    ) {

      targetY +=
        (Math.random() - 0.5) * 180;
    }

    if (
      aiLevel.value === "medium" &&
      Math.random() < 0.012
    ) {

      targetY +=
        (Math.random() - 0.5) * 80;
    }

    targetY =
      Math.max(
        paddle.height / 2,
        Math.min(
          H - paddle.height / 2,
          targetY
        )
      );

    const difference =
      targetY - cpuCentre;

    if (
      Math.abs(difference) > 5
    ) {

      const movement =
        Math.sign(difference) *
        Math.min(
          Math.abs(difference) *
          level.reaction,
          level.speed
        );

      player2.y += movement;
    }
  }


  /* =========================
     CLAMP PADDLES
  ========================= */

  player1.y =
    Math.max(
      0,
      Math.min(
        H - paddle.height,
        player1.y
      )
    );

  player2.y =
    Math.max(
      0,
      Math.min(
        H - paddle.height,
        player2.y
      )
    );


  /* =========================
     BALL
  ========================= */

  ball.x += ball.vx;
  ball.y += ball.vy;


  /* =========================
     WALLS
  ========================= */

  if (
    ball.y - ball.radius <= 0 ||
    ball.y + ball.radius >= H
  ) {

    ball.vy *= -1;

    ball.y =
      Math.max(
        ball.radius,
        Math.min(
          H - ball.radius,
          ball.y
        )
      );
  }


  /* =========================
     PLAYER 1 HIT
  ========================= */

  if (
    ball.x - ball.radius <=
      player1.x + paddle.width &&

    ball.x + ball.radius >=
      player1.x &&

    ball.y >= player1.y &&

    ball.y <=
      player1.y + paddle.height &&

    ball.vx < 0
  ) {

    bounceOffPaddle(player1);

    message.textContent =
      "CLEAN HIT, BRUV. 🔥";
  }


  /* =========================
     PLAYER 2 / AI HIT
  ========================= */

  if (
    ball.x + ball.radius >=
      player2.x &&

    ball.x - ball.radius <=
      player2.x + paddle.width &&

    ball.y >= player2.y &&

    ball.y <=
      player2.y + paddle.height &&

    ball.vx > 0
  ) {

    bounceOffPaddle(player2);

    message.textContent =
      gameMode === "ai" &&
      aiLevel.value === "block"

        ? "OI! THAT'S MY BLOCK. 💀"

        : "OI, NO CHANCE BLUD.";
  }


  /* =========================
     LEFT SIDE SCORED
  ========================= */

  if (
    ball.x < -ball.radius
  ) {

    player2.score++;

    checkWinner();

    if (!gameOver) {

      message.textContent =
        gameMode === "pvp"
          ? "PLAYER 2 SCORES! 🗿"
          : "OI! GET OFF MY BLOCK! 😭";

      resetBall(1);
    }
  }


  /* =========================
     RIGHT SIDE SCORED
  ========================= */

  if (
    ball.x > W + ball.radius
  ) {

    player1.score++;

    checkWinner();

    if (!gameOver) {

      message.textContent =
        "PLAYER 1 OWNS THE BLOCK. 🗿";

      resetBall(-1);
    }
  }
}


/* =========================
   PADDLE BOUNCE
========================= */

function bounceOffPaddle(p) {

  const centre =
    p.y + paddle.height / 2;

  const hit =
    (ball.y - centre) /
    (paddle.height / 2);

  const maxAngle =
    Math.PI / 3;

  const angle =
    hit * maxAngle;

  const direction =
    ball.vx > 0
      ? -1
      : 1;

  ball.speed =
    Math.min(
      ball.speed + 0.55,
      19
    );

  ball.vx =
    Math.cos(angle) *
    ball.speed *
    direction;

  ball.vy =
    Math.sin(angle) *
    ball.speed;

  if (direction === 1) {

    ball.x =
      p.x +
      paddle.width +
      ball.radius;

  } else {

    ball.x =
      p.x -
      ball.radius;
  }
}


/* =========================
   WINNER
========================= */

function checkWinner() {

  if (
    player1.score >= WINNING_SCORE ||
    player2.score >= WINNING_SCORE
  ) {

    gameOver = true;
    running = false;

    if (
      player1.score >
      player2.score
    ) {

      message.textContent =
        gameMode === "pvp"
          ? "PLAYER 1 OWNS THE BLOCK! 🏆"
          : "YOU OWN THE BLOCK! 🏆🇬🇧";

    } else {

      message.textContent =
        gameMode === "pvp"
          ? "PLAYER 2 OWNS THE BLOCK! 🏆"
          : "OI GET OFF MY BLOCK. CPU WINS. 💀";
    }
  }
}


/* =========================
   DRAW ROUNDED RECT
========================= */

function drawRoundedRect(
  x,
  y,
  w,
  h,
  r
) {

  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    w,
    h,
    r
  );

  ctx.fill();
}


/* =========================
   GLOW CIRCLE
========================= */

function drawGlowCircle(
  x,
  y,
  radius,
  colour
) {

  ctx.save();

  ctx.shadowColor = colour;
  ctx.shadowBlur = 30;

  ctx.fillStyle = colour;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================
   DRAW
========================= */

function draw() {

  /* Background */

  ctx.fillStyle = "#06060d";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* Grid */

  ctx.strokeStyle =
    "rgba(255,255,255,0.035)";

  ctx.lineWidth = 1;

  for (
    let x = 0;
    x < W;
    x += 50
  ) {

    ctx.beginPath();

    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);

    ctx.stroke();
  }

  for (
    let y = 0;
    y < H;
    y += 50
  ) {

    ctx.beginPath();

    ctx.moveTo(0, y);
    ctx.lineTo(W, y);

    ctx.stroke();
  }


  /* Centre line */

  ctx.strokeStyle =
    "rgba(255,255,255,0.12)";

  ctx.setLineDash([
    12,
    14
  ]);

  ctx.beginPath();

  ctx.moveTo(
    W / 2,
    0
  );

  ctx.lineTo(
    W / 2,
    H
  );

  ctx.stroke();

  ctx.setLineDash([]);


  /* Scores */

  ctx.font =
    "bold 90px Arial";

  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "rgba(0,234,255,0.18)";

  ctx.fillText(
    player1.score,
    W * 0.25,
    105
  );

  ctx.fillStyle =
    "rgba(255,23,68,0.2)";

  ctx.fillText(
    player2.score,
    W * 0.75,
    105
  );


  /* Player 1 */

  ctx.fillStyle =
    "#00eaff";

  ctx.shadowColor =
    "#00eaff";

  ctx.shadowBlur = 25;

  drawRoundedRect(
    player1.x,
    player1.y,
    paddle.width,
    paddle.height,
    9
  );


  /* Player 2 */

  let p2Colour =
    "#ff1744";

  if (
    gameMode === "ai"
  ) {

    p2Colour =
      difficulties[
        aiLevel.value
      ].colour;
  }

  ctx.fillStyle =
    p2Colour;

  ctx.shadowColor =
    p2Colour;

  ctx.shadowBlur = 30;

  drawRoundedRect(
    player2.x,
    player2.y,
    paddle.width,
    paddle.height,
    9
  );

  ctx.shadowBlur = 0;


  /* Ball */

  drawGlowCircle(
    ball.x,
    ball.y,
    ball.radius,
    "#ffffff"
  );


  /* Start overlay */

  if (
    !running &&
    !gameOver
  ) {

    ctx.fillStyle =
      "rgba(0,0,0,0.42)";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.font =
      "bold 30px Arial";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "PRESS SPACE TO START",
      W / 2,
      H / 2
    );
  }


  /* Game over */

  if (gameOver) {

    ctx.fillStyle =
      "rgba(0,0,0,0.52)";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.font =
      "bold 34px Arial";

    ctx.textAlign =
      "center";

    const playerWon =
      player1.score >
      player2.score;

    ctx.fillText(
      playerWon
        ? "PLAYER 1 WINS 🏆"
        : "PLAYER 2 WINS 🏆",
      W / 2,
      H / 2 - 20
    );

    ctx.font =
      "20px Arial";

    ctx.fillText(
      "Press R or SPACE to run it back",
      W / 2,
      H / 2 + 25
    );
  }
}


/* =========================
   GAME LOOP
========================= */

function loop() {

  update();
  draw();

  requestAnimationFrame(loop);
}

resetGame();
loop();

</script>

</body>
</html>
