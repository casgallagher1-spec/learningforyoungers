<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON VOID 3D</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#02020b;
}

#hud{
    position:fixed;
    top:20px;
    left:20px;
    right:20px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    color:#00ffff;
    font-size:20px;
    font-weight:bold;
    text-shadow:0 0 15px #00ffff;
    pointer-events:none;
}

#help{
    position:fixed;
    bottom:15px;
    left:0;
    width:100%;
    z-index:10;
    text-align:center;
    color:#00ffff;
    font-size:13px;
    text-shadow:0 0 10px #00ffff;
    pointer-events:none;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,10,.92);
}

.box{
    width:500px;
    max-width:85%;
    padding:45px;
    text-align:center;
    border:2px solid #00ffff;
    border-radius:25px;
    background:#05051d;
    box-shadow:
        0 0 30px #00ffff,
        0 0 100px #003cff;
}

h1{
    margin:0;
    font-size:75px;
    letter-spacing:10px;
    color:#00ffff;
    text-shadow:
        0 0 15px #00ffff,
        0 0 40px #0088ff,
        0 0 80px #0044ff;
}

h2{
    font-size:45px;
    margin:5px;
    color:#ff176f;
    text-shadow:0 0 25px #ff176f;
}

p{
    color:#bdeaff;
    line-height:1.8;
}

button{
    display:inline-block;
    margin-top:20px;
    padding:18px 55px;
    border:2px solid #00ffff;
    border-radius:12px;
    background:#001c25;
    color:#00ffff;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 20px #00ffff;
}

button:hover{
    background:#00ffff;
    color:#001018;
    box-shadow:0 0 50px #00ffff;
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>
<a href="index.html" style="
position:fixed;
top:15px;
right:15px;
z-index:9999;
padding:12px 20px;
border-radius:14px;
background:linear-gradient(135deg,#5865f2,#a855f7);
color:white;
text-decoration:none;
font:bold 14px Arial;
letter-spacing:1.5px;
border:2px solid rgba(255,255,255,.3);
box-shadow:0 5px 0 #3b3f9e,0 8px 18px rgba(0,0,0,.35);
transition:.15s;
" onmouseover="this.style.transform='translateY(-2px)';this.style.filter='brightness(1.2)'"
onmouseout="this.style.transform='';this.style.filter=''"
>
⌂ HOME
</a>
<canvas id="game"></canvas>

<div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>ENERGY: <span id="energy">0</span></div>
    <div>❤ <span id="lives">3</span></div>
</div>

<div id="help">
    A / D or ARROWS = MOVE
    &nbsp; • &nbsp;
    W / S = UP/DOWN
    &nbsp; • &nbsp;
    SPACE = BOOST
</div>

<div id="menu">
    <div class="box">

        <h1>NEON</h1>
        <h2>VOID 3D</h2>

        <p>
            DODGE THE ASTEROIDS<br>
            COLLECT ENERGY CORES<br>
            SURVIVE AS LONG AS POSSIBLE
        </p>

        <button id="startButton">START GAME</button>

    </div>
</div>

<script>

"use strict";


/* =====================================
   CANVAS
===================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

window.addEventListener("resize", resize);
resize();


/* =====================================
   MENU
===================================== */

const menu = document.getElementById("menu");
const startButton = document.getElementById("startButton");

startButton.addEventListener("click", startGame);


/* =====================================
   GAME VARIABLES
===================================== */

let playing = false;

let score = 0;
let energy = 0;
let lives = 3;
let frame = 0;

let player = {
    x:0,
    y:0
};

let objects = [];
let particles = [];
let keys = {};


/* =====================================
   KEYBOARD
===================================== */

window.addEventListener("keydown",function(e){

    keys[e.key.toLowerCase()] = true;

    if(e.code === "Space"){

        keys.space = true;

        e.preventDefault();
    }

});

window.addEventListener("keyup",function(e){

    keys[e.key.toLowerCase()] = false;

    if(e.code === "Space"){
        keys.space = false;
    }

});


/* =====================================
   STARS
===================================== */

let stars = [];

function createStars(){

    stars = [];

    for(let i=0;i<700;i++){

        stars.push({

            x:(Math.random()-.5)*W*2,

            y:(Math.random()-.5)*H*2,

            z:Math.random()*1200+1,

            size:Math.random()*2+0.5

        });

    }
}

createStars();


/* =====================================
   START GAME
===================================== */

function startGame(){

    menu.classList.add("hidden");

    score = 0;
    energy = 0;
    lives = 3;
    frame = 0;

    objects = [];
    particles = [];

    player.x = W/2;
    player.y = H*.75;

    playing = true;

    updateHUD();
}


/* =====================================
   GAME OVER
===================================== */

function gameOver(){

    playing = false;

    menu.classList.remove("hidden");

    document.querySelector(".box").innerHTML =

        "<h2>GAME OVER</h2>" +

        "<p>" +

        "FINAL SCORE: <b>" +
        Math.floor(score) +
        "</b><br><br>" +

        "ENERGY: <b>" +
        energy +
        "</b>" +

        "</p>" +

        "<button id='restartButton'>" +
        "PLAY AGAIN" +
        "</button>";

    document
        .getElementById("restartButton")
        .addEventListener("click",function(){

            location.reload();

        });
}


/* =====================================
   HUD
===================================== */

function updateHUD(){

    document.getElementById("score").textContent =
        Math.floor(score);

    document.getElementById("energy").textContent =
        energy;

    document.getElementById("lives").textContent =
        lives;
}


/* =====================================
   ASTEROIDS
===================================== */

function spawnAsteroid(){

    objects.push({

        type:"asteroid",

        x:(Math.random()-.5)*100,

        y:(Math.random()-.5)*65,

        z:1100,

        /* SMALLER ASTEROIDS */

        size:12 + Math.random()*25,

        speed:5 + Math.random()*6,

        rotation:Math.random()*Math.PI*2

    });
}


/* =====================================
   ENERGY CORES
===================================== */

function spawnCore(){

    objects.push({

        type:"core",

        x:(Math.random()-.5)*85,

        y:(Math.random()-.5)*55,

        z:1100,

        size:18,

        speed:8

    });
}


/* =====================================
   EXPLOSIONS
===================================== */

function explode(px,py,color){

    for(let i=0;i<45;i++){

        const angle =
            Math.random()*Math.PI*2;

        const speed =
            Math.random()*12+2;

        particles.push({

            x:px,

            y:py,

            vx:Math.cos(angle)*speed,

            vy:Math.sin(angle)*speed,

            life:1,

            color:color,

            size:Math.random()*5+1

        });
    }
}


/* =====================================
   UPDATE GAME
===================================== */

function update(){

    if(!playing){
        return;
    }

    frame++;

    score += .12;


    const difficulty =
        1 + frame/4000;


    /* PLAYER SPEED */

    let speed =
        keys.space ? 12 : 7;


    /* LEFT */

    if(keys.a || keys.arrowleft){

        player.x -= speed;

    }


    /* RIGHT */

    if(keys.d || keys.arrowright){

        player.x += speed;

    }


    /* UP */

    if(keys.w || keys.arrowup){

        player.y -= speed;

    }


    /* DOWN */

    if(keys.s || keys.arrowdown){

        player.y += speed;

    }


    /* KEEP PLAYER ON SCREEN */

    player.x = Math.max(
        50,
        Math.min(W-50,player.x)
    );

    player.y = Math.max(
        80,
        Math.min(H-50,player.y)
    );


    /* =================================
       SPAWN OBJECTS
    ================================= */

    const asteroidRate =
        Math.max(
            10,
            Math.floor(42-difficulty*6)
        );


    if(frame % asteroidRate === 0){

        spawnAsteroid();

    }


    if(frame % 100 === 0){

        spawnCore();

    }


    /* =================================
       MOVE OBJECTS
    ================================= */

    for(let i=objects.length-1;i>=0;i--){

        const o = objects[i];


        o.z -=
            o.speed *
            (keys.space ? 1.7 : 1);


        if(o.type === "asteroid"){

            o.rotation += .05;

        }


        /* 3D PROJECTION */

        const scale =
            700/o.z;


        const screenX =
            W/2 + o.x*scale;


        const screenY =
            H/2 + o.y*scale;


        const size =
            o.size*scale;


        /* =================================
           COLLISION

           Asteroids disappear while still
           far enough away to keep the view
           clear.
        ================================= */

        if(o.z < 300){

            const dx =
                screenX-player.x;

            const dy =
                screenY-player.y;

            const distance =
                Math.sqrt(dx*dx+dy*dy);


            if(distance < size+35){

                if(o.type === "core"){

                    energy++;

                    score += 150;

                    explode(
                        screenX,
                        screenY,
                        "#00ffff"
                    );

                }

                else{

                    lives--;

                    explode(
                        screenX,
                        screenY,
                        "#ff1744"
                    );


                    if(lives <= 0){

                        objects.splice(i,1);

                        updateHUD();

                        gameOver();

                        return;
                    }
                }


                objects.splice(i,1);

                continue;
            }
        }


        /* =================================
           REMOVE BEFORE THEY GET TOO CLOSE
        ================================= */

        if(o.z < 300){

            objects.splice(i,1);

        }

    }


    /* =================================
       PARTICLES
    ================================= */

    for(let i=particles.length-1;i>=0;i--){

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= .96;
        p.vy *= .96;

        p.life -= .025;


        if(p.life <= 0){

            particles.splice(i,1);

        }
    }


    /* =================================
       STAR MOVEMENT
    ================================= */

    for(const star of stars){

        star.z -=
            keys.space ? 22 : 9;


        if(star.z < 1){

            star.z = 1200;

            star.x =
                (Math.random()-.5)*W*2;

            star.y =
                (Math.random()-.5)*H*2;

        }
    }


    updateHUD();
}


/* =====================================
   BACKGROUND
===================================== */

function drawBackground(){

    const gradient =
        ctx.createRadialGradient(

            W/2,
            H/2,
            0,

            W/2,
            H/2,
            Math.max(W,H)

        );


    gradient.addColorStop(
        0,
        "#171760"
    );


    gradient.addColorStop(
        .35,
        "#08082d"
    );


    gradient.addColorStop(
        1,
        "#000003"
    );


    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =====================================
   STARS
===================================== */

function drawStars(){

    for(const star of stars){

        const scale =
            500/star.z;


        const sx =
            W/2 + star.x*scale;


        const sy =
            H/2 + star.y*scale;


        const size =
            Math.max(
                .5,
                star.size*scale*2
            );


        if(
            sx < 0 ||
            sx > W ||
            sy < 0 ||
            sy > H
        ){

            continue;

        }


        ctx.fillStyle =
            "rgba(100,230,255," +
            Math.min(1,scale*1.5) +
            ")";


        ctx.fillRect(
            sx,
            sy,
            size,
            size
        );


        if(keys.space && scale>.4){

            ctx.strokeStyle =
                "rgba(0,255,255,.4)";

            ctx.lineWidth = size;

            ctx.beginPath();

            ctx.moveTo(
                sx,
                sy
            );

            ctx.lineTo(
                sx,
                sy+size*8
            );

            ctx.stroke();
        }

    }
}


/* =====================================
   3D GRID
===================================== */

function drawGrid(){

    const horizon =
        H*.57;


    ctx.strokeStyle =
        "rgba(0,255,255,.14)";

    ctx.lineWidth = 1;


    for(let i=1;i<25;i++){

        const t = i/25;


        const y =
            horizon +
            Math.pow(t,2)*
            (H-horizon);


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }


    for(let i=-14;i<=14;i++){

        ctx.beginPath();

        ctx.moveTo(
            W/2,
            horizon
        );

        ctx.lineTo(
            W/2+i*110,
            H
        );

        ctx.stroke();
    }
}


/* =====================================
   ASTEROID DRAWING
===================================== */

function drawAsteroid(o){

    const scale =
        700/o.z;


    const sx =
        W/2+o.x*scale;


    const sy =
        H/2+o.y*scale;


    const r =
        o.size*scale;


    if(r<1){
        return;
    }


    ctx.save();

    ctx.translate(
        sx,
        sy
    );


    ctx.rotate(
        o.rotation
    );


    ctx.shadowBlur = 35;

    ctx.shadowColor =
        "#ff1744";


    const gradient =
        ctx.createRadialGradient(

            -r*.35,
            -r*.35,
            2,

            0,
            0,
            r
        );


    gradient.addColorStop(
        0,
        "#ffbb88"
    );


    gradient.addColorStop(
        .3,
        "#d83b45"
    );


    gradient.addColorStop(
        .7,
        "#64152a"
    );


    gradient.addColorStop(
        1,
        "#18030d"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();


    const points = 10;


    for(let i=0;i<points;i++){

        const angle =
            i/points*Math.PI*2;


        const rr =
            r*(.72+Math.random()*.28);


        const px =
            Math.cos(angle)*rr;


        const py =
            Math.sin(angle)*rr;


        if(i===0){

            ctx.moveTo(
                px,
                py
            );

        }
        else{

            ctx.lineTo(
                px,
                py
            );

        }
    }


    ctx.closePath();

    ctx.fill();


    ctx.restore();
}


/* =====================================
   ENERGY CORE DRAWING
===================================== */

function drawCore(o){

    const scale =
        700/o.z;


    const sx =
        W/2+o.x*scale;


    const sy =
        H/2+o.y*scale;


    const r =
        o.size*scale;


    ctx.save();


    ctx.translate(
        sx,
        sy
    );


    ctx.rotate(
        frame*.05
    );


    ctx.shadowBlur = 45;

    ctx.shadowColor =
        "#00ffff";


    ctx.strokeStyle =
        "#00ffff";


    ctx.lineWidth =
        Math.max(
            2,
            r*.12
        );


    ctx.beginPath();

    ctx.moveTo(
        0,
        -r
    );

    ctx.lineTo(
        r*.75,
        0
    );

    ctx.lineTo(
        0,
        r
    );

    ctx.lineTo(
        -r*.75,
        0
    );

    ctx.closePath();

    ctx.stroke();


    ctx.fillStyle =
        "rgba(0,255,255,.15)";

    ctx.fill();


    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.moveTo(
        0,
        -r*.5
    );

    ctx.lineTo(
        r*.35,
        0
    );

    ctx.lineTo(
        0,
        r*.5
    );

    ctx.lineTo(
        -r*.35,
        0
    );

    ctx.closePath();

    ctx.stroke();


    ctx.restore();
}


/* =====================================
   PLAYER SHIP
===================================== */

function drawShip(){

    const px =
        player.x;


    const py =
        player.y;


    let tilt = 0;


    if(
        keys.a ||
        keys.arrowleft
    ){

        tilt = -.25;

    }


    if(
        keys.d ||
        keys.arrowright
    ){

        tilt = .25;

    }


    ctx.save();


    ctx.translate(
        px,
        py
    );


    ctx.rotate(
        tilt
    );


    /* ENGINE */

    const flame =
        keys.space
        ? 90
        : 45;


    const engineGradient =
        ctx.createLinearGradient(
            0,
            10,
            0,
            flame
        );


    engineGradient.addColorStop(
        0,
        "#ffffff"
    );


    engineGradient.addColorStop(
        .25,
        keys.space
        ? "#ffff00"
        : "#00ffff"
    );


    engineGradient.addColorStop(
        1,
        "rgba(0,80,255,0)"
    );


    ctx.fillStyle =
        engineGradient;


    ctx.shadowBlur = 45;


    ctx.shadowColor =
        keys.space
        ? "#ffff00"
        : "#00ffff";


    ctx.beginPath();

    ctx.moveTo(
        -14,
        18
    );

    ctx.lineTo(
        0,
        flame
    );

    ctx.lineTo(
        14,
        18
    );

    ctx.closePath();

    ctx.fill();


    /* WINGS */

    const wingGradient =
        ctx.createLinearGradient(
            -65,
            0,
            65,
            0
        );


    wingGradient.addColorStop(
        0,
        "#0015ff"
    );


    wingGradient.addColorStop(
        .5,
        "#00ffff"
    );


    wingGradient.addColorStop(
        1,
        "#0015ff"
    );


    ctx.fillStyle =
        wingGradient;


    ctx.shadowBlur = 30;

    ctx.shadowColor =
        "#0088ff";


    ctx.beginPath();

    ctx.moveTo(
        0,
        -55
    );

    ctx.lineTo(
        62,
        28
    );

    ctx.lineTo(
        13,
        18
    );

    ctx.lineTo(
        0,
        32
    );

    ctx.lineTo(
        -13,
        18
    );

    ctx.lineTo(
        -62,
        28
    );

    ctx.closePath();

    ctx.fill();


    /* BODY */

    ctx.fillStyle =
        "#00aaff";


    ctx.beginPath();

    ctx.moveTo(
        0,
        -65
    );

    ctx.lineTo(
        20,
        28
    );

    ctx.lineTo(
        0,
        20
    );

    ctx.lineTo(
        -20,
        28
    );

    ctx.closePath();

    ctx.fill();


    /* COCKPIT */

    ctx.shadowBlur = 25;

    ctx.shadowColor =
        "#ffffff";


    ctx.fillStyle =
        "#eaffff";


    ctx.beginPath();

    ctx.ellipse(
        0,
        -13,
        10,
        22,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#008cff";


    ctx.beginPath();

    ctx.ellipse(
        0,
        -13,
        5,
        14,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}


/* =====================================
   PARTICLES
===================================== */

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha =
            p.life;


        ctx.fillStyle =
            p.color;


        ctx.shadowBlur = 20;

        ctx.shadowColor =
            p.color;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.globalAlpha = 1;
}


/* =====================================
   DRAW EVERYTHING
===================================== */

function draw(){

    drawBackground();

    drawStars();

    drawGrid();


    const sorted =
        objects
        .slice()
        .sort(
            (a,b)=>b.z-a.z
        );


    for(const o of sorted){

        if(
            o.type === "asteroid"
        ){

            drawAsteroid(o);

        }
        else{

            drawCore(o);

        }
    }


    if(playing){

        drawShip();

    }


    drawParticles();
}


/* =====================================
   MAIN GAME LOOP
===================================== */

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );
}

gameLoop();

</script>

</body>
</html>
