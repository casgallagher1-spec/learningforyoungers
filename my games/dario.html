<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dario Deluxe 🍄</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;overflow:hidden;font-family:Arial,sans-serif}
canvas{display:block;margin:auto;background:#69c8ff;image-rendering:pixelated}
#ui{
 position:fixed;top:10px;left:12px;color:#fff;font-size:19px;
 font-weight:bold;text-shadow:3px 3px #000;z-index:5
}
#screen{
 position:fixed;inset:0;background:rgba(0,0,0,.75);color:white;
 display:none;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;z-index:20
}
#screen h1{font-size:52px;margin:10px}
#screen p{font-size:21px}
</style>
</head>

<body>
<a href="index.html" style="
position:fixed;
top:15px;
right:15px;
z-index:9999;
padding:12px 20px;
border-radius:14px;
background:linear-gradient(135deg,#5865f2,#a855f7);
color:white;
text-decoration:none;
font:bold 14px Arial;
letter-spacing:1.5px;
border:2px solid rgba(255,255,255,.3);
box-shadow:0 5px 0 #3b3f9e,0 8px 18px rgba(0,0,0,.35);
transition:.15s;
" onmouseover="this.style.transform='translateY(-2px)';this.style.filter='brightness(1.2)'"
onmouseout="this.style.transform='';this.style.filter=''"
>
⌂ HOME
</a>
<div id="ui">
❤️ <span id="lives">3</span>
&nbsp; 🪙 <span id="coins">0</span>
&nbsp; ⭐ <span id="score">0</span>
&nbsp; 🌎 <span id="lvl">1</span>/500
&nbsp; ⚡ <span id="power">NORMAL</span>
</div>

<div id="screen">
<h1 id="title"></h1>
<p id="message"></p>
<p>Press R</p>
</div>

<canvas id="game" width="960" height="540"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let keys={};

document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;

 if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))
   e.preventDefault();

 if(e.key.toLowerCase()=="r") handleR();
});

document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});


// =====================================================
// GAME
// =====================================================

const MAX_LEVEL=500;

let level=1;
let lives=3;
let coins=0;
let score=0;

let camera=0;

let gameOver=false;
let finished=false;
let levelDone=false;

let power="NORMAL";
let powerTimer=0;

let fireballs=[];
let particles=[];

let world;


// =====================================================
// PLAYER
// =====================================================

const player={
 x:70,y:430,
 w:32,h:42,
 vx:0,vy:0,
 speed:5,
 jump:13,
 grounded:false,
 invincible:0,
 big:false
};


// =====================================================
// RANDOM LEVEL GENERATOR
// =====================================================

function rng(seed){

 let n=seed;

 return function(){
   n=(n*9301+49297)%233280;
   return n/233280;
 };
}


function makeLevel(n){

 const r=rng(n*12345+999);

 const difficulty=Math.min(1,n/500);

 const width=1800+
   Math.floor(difficulty*5500);

 let platforms=[
   {x:0,y:500,w:width,h:40}
 ];

 let blocks=[];
 let coinsHere=[];
 let enemies=[];
 let powerups=[];
 let pipes=[];
 let springs=[];
 let moving=[];

 let x=100;

 while(x<width-300){

   let w=100+r()*150;
   let y=280+r()*130;

   platforms.push({
     x:x,y:y,w:w,h:20
   });


   // COIN

   if(r()>.2){
     coinsHere.push({
       x:x+w/2,
       y:y-27,
       taken:false
     });
   }


   // LUCKY BLOCK

   if(r()<.28){

     blocks.push({
       x:x+w/2-18,
       y:y-70,
       w:36,
       h:36,
       used:false,
       bounce:0
     });
   }


   // ENEMY

   if(r()<.3+difficulty*.4){

     enemies.push({
       x:x+w/2,
       y:y-35,
       w:32,h:35,
       vx:(r()>.5?1:-1)*(1.2+difficulty*1.5),
       min:x,
       max:x+w-32,
       alive:true
     });
   }


   // SPRING

   if(r()<.12){

     springs.push({
       x:x+w/2-12,
       y:y-18,
       w:24,h:18
     });
   }


   x+=w+60+r()*110;
 }


 // FLOOR ENEMIES

 let floorCount=4+Math.floor(difficulty*12);

 for(let i=0;i<floorCount;i++){

   let ex=250+r()*(width-500);

   enemies.push({
     x:ex,
     y:465,
     w:32,h:35,
     vx:(r()>.5?1:-1)*(1.3+difficulty*1.7),
     min:Math.max(20,ex-100),
     max:Math.min(width-50,ex+100),
     alive:true
   });
 }


 // EXTRA COINS

 for(let i=0;i<7+Math.floor(difficulty*20);i++){

   coinsHere.push({
     x:150+r()*(width-300),
     y:180+r()*250,
     taken:false
   });
 }


 // PIPES

 for(let i=0;i<Math.floor(2+difficulty*7);i++){

   pipes.push({
     x:500+r()*(width-700),
     y:450,
     w:55,
     h:50
   });
 }


 // MOVING PLATFORMS

 for(let i=0;i<Math.floor(difficulty*5);i++){

   moving.push({
     x:500+r()*(width-900),
     y:220+r()*170,
     w:100,
     h:18,
     start:500+r()*(width-900),
     range:80+r()*120,
     t:r()*10
   });
 }


 // SPECIAL POWERUP SPAWNS

 if(r()>.25){

   powerups.push({
     x:700+r()*(width-900),
     y:430,
     type:["MUSHROOM","STAR","SPEED","FIRE","HEART"]
       [Math.floor(r()*5)],
     active:true
   });
 }


 return{
   width,
   platforms,
   blocks,
   coins:coinsHere,
   enemies,
   powerups,
   pipes,
   springs,
   moving,
   goal:width-120
 };
}


// =====================================================
// LOAD
// =====================================================

function loadLevel(n){

 world=makeLevel(n);

 player.x=70;
 player.y=430;
 player.vx=0;
 player.vy=0;
 player.grounded=false;
 player.invincible=100;

 power="NORMAL";
 powerTimer=0;
 fireballs=[];

 camera=0;
 levelDone=false;

 hideScreen();
 updateUI();
}


// =====================================================
// COLLISION
// =====================================================

function hit(a,b){

 return(
   a.x<a.x+a.w &&
   a.x+a.w>b.x &&
   a.y<b.y+b.h &&
   a.y+a.h>b.y
 );
}


// =====================================================
// RECT COLLISION
// =====================================================

function touching(a,b){

 return(
   a.x<b.x+b.w &&
   a.x+a.w>b.x &&
   a.y<b.y+b.h &&
   a.y+a.h>b.y
 );
}


// =====================================================
// UPDATE
// =====================================================

function update(){

 if(gameOver||finished||levelDone)return;


 // MOVEMENT

 let currentSpeed=player.speed;

 if(power=="SPEED")
   currentSpeed=8;

 if(keys["a"]||keys["arrowleft"])
   player.vx=-currentSpeed;

 else if(keys["d"]||keys["arrowright"])
   player.vx=currentSpeed;

 else
   player.vx*=.8;


 // JUMP

 if(
   (keys["w"]||keys["arrowup"]||keys[" "]) &&
   player.grounded
 ){

   player.vy=power=="STAR"?-14:-13;
   player.grounded=false;
 }


 // GRAVITY

 player.vy+=.65;

 let oldY=player.y;

 player.x+=player.vx;
 player.y+=player.vy;

 player.grounded=false;


 // PLATFORMS

 for(let p of world.platforms){

   if(
     player.x+player.w>p.x &&
     player.x<p.x+p.w &&
     player.y+player.h>=p.y &&
     oldY+player.h<=p.y+12 &&
     player.vy>=0
   ){

     player.y=p.y-player.h;
     player.vy=0;
     player.grounded=true;
   }
 }


 // MOVING PLATFORMS

 for(let p of world.moving){

   p.t+=.02;

   p.x=p.start+
     Math.sin(p.t)*p.range;

   if(
     player.x+player.w>p.x &&
     player.x<p.x+p.w &&
     player.y+player.h>=p.y &&
     oldY+player.h<=p.y+12 &&
     player.vy>=0
   ){

     player.y=p.y-player.h;
     player.vy=0;
     player.grounded=true;
   }
 }


 // SPRINGS

 for(let s of world.springs){

   if(
     touching(player,s)&&
     player.vy>=0
   ){

     player.vy=-19;
     player.grounded=false;
   }
 }


 // COINS

 for(let c of world.coins){

   if(c.taken)continue;

   let dx=player.x+16-c.x;
   let dy=player.y+20-c.y;

   if(Math.sqrt(dx*dx+dy*dy)<30){

     c.taken=true;
     coins++;
     score+=100;

     burst(c.x,c.y,"#ffd92f");
   }
 }


 // LUCKY BLOCKS

 for(let b of world.blocks){

   if(b.used)continue;

   if(
     player.x+player.w>b.x &&
     player.x<b.x+b.w &&
     player.y<=b.y+b.h &&
     player.y+player.h>=b.y &&
     player.vy<0
   ){

     b.used=true;
     b.bounce=10;

     luckyBlock(b);
   }
 }


 // POWERUPS

 for(let p of world.powerups){

   if(!p.active)continue;

   let box={
     x:p.x-15,
     y:p.y-15,
     w:30,
     h:30
   };

   if(touching(player,box)){

     p.active=false;
     collectPower(p.type);
   }
 }


 // ENEMIES

 for(let e of world.enemies){

   if(!e.alive)continue;

   e.x+=e.vx;

   if(e.x<=e.min||e.x>=e.max)
     e.vx*=-1;


   let box={
     x:e.x,y:e.y,
     w:e.w,h:e.h
   };


   if(touching(player,box)){

     // STAR = destroy

     if(power=="STAR"){

       e.alive=false;
       score+=500;
       burst(e.x,e.y,"#fff");

     }

     // FIRE = destroy

     else if(power=="FIRE"){

       e.alive=false;
       score+=500;

     }

     // STOMP

     else if(
       player.vy>0 &&
       player.y+player.h-10<e.y+15
     ){

       e.alive=false;
       player.vy=-10;
       score+=200;

       burst(e.x,e.y,"#ff9944");
     }

     // HIT

     else if(player.invincible<=0){

       hurt();
     }
   }
 }


 // FIREBALLS

 for(let f of fireballs){

   f.x+=f.vx;

   for(let e of world.enemies){

     if(
       e.alive &&
       f.x<e.x+e.w &&
       f.x+12>e.x &&
       f.y<e.y+e.h &&
       f.y+12>e.y
     ){

       e.alive=false;
       f.dead=true;
       score+=300;
     }
   }
 }

 fireballs=fireballs.filter(f=>!f.dead);


 // SHOOT FIREBALL

 if(
   power=="FIRE" &&
   keys["f"]
 ){

   if(!player.shootCooldown){

     fireballs.push({
       x:player.x+player.w,
       y:player.y+15,
       vx:player.vx>=0?9:-9,
       dead:false
     });

     player.shootCooldown=15;
   }
 }

 if(player.shootCooldown)
   player.shootCooldown--;


 // POWER TIMER

 if(powerTimer>0){

   powerTimer--;

   if(powerTimer<=0){

     power="NORMAL";
     player.big=false;
   }
 }


 if(player.invincible>0)
   player.invincible--;


 // FALL

 if(player.y>650)
   hurt();


 // GOAL

 if(player.x+player.w>world.goal)
   completeLevel();


 // CAMERA

 camera=player.x-300;

 if(camera<0)camera=0;

 let max=world.width-canvas.width;

 if(camera>max)camera=max;


 updateParticles();
 updateUI();
}


// =====================================================
// LUCKY BLOCK
// =====================================================

function luckyBlock(b){

 let choices=[
   "COIN",
   "COIN",
   "MUSHROOM",
   "STAR",
   "SPEED",
   "FIRE",
   "HEART"
 ];

 let choice=
   choices[Math.floor(Math.random()*choices.length)];


 if(choice=="COIN"){

   coins++;
   score+=100;
   burst(b.x,b.y,"#ffd92f");

 }

 else if(choice=="HEART"){

   lives++;
   burst(b.x,b.y,"#ff4b68");

 }

 else{

   collectPower(choice);
 }
}


// =====================================================
// POWERUPS
// =====================================================

function collectPower(type){

 if(type=="MUSHROOM"){

   player.big=true;
   player.h=55;
   player.y-=13;

   power="BIG";
   powerTimer=900;
   score+=300;
 }

 else if(type=="STAR"){

   power="STAR";
   powerTimer=600;
   player.invincible=600;
   score+=500;
 }

 else if(type=="SPEED"){

   power="SPEED";
   powerTimer=700;
   score+=300;
 }

 else if(type=="FIRE"){

   power="FIRE";
   powerTimer=900;
   score+=400;
 }

 else if(type=="HEART"){

   lives++;
   score+=200;
 }

 burst(
   player.x,
   player.y,
   type=="STAR"?"#fff":"#ffdf3f"
 );
}


// =====================================================
// DAMAGE
// =====================================================

function hurt(){

 if(power=="STAR")return;

 if(power=="BIG"){

   power="NORMAL";
   powerTimer=0;

   player.big=false;
   player.h=42;

   player.invincible=120;

   return;
 }


 lives--;

 if(lives<=0){

   gameOver=true;

   showScreen(
     "GAME OVER 💀",
     "Dario reached level "+level+"!"
   );

 }else{

   player.x=70;
   player.y=400;
   player.vx=0;
   player.vy=0;
   player.invincible=120;
 }
}


// =====================================================
// LEVEL COMPLETE
// =====================================================

function completeLevel(){

 levelDone=true;

 if(level>=MAX_LEVEL){

   finished=true;

   showScreen(
     "🏆 DARIO LEGEND 🏆",
     "YOU BEAT ALL 500 LEVELS! Score: "+score
   );

 }else{

   showScreen(
     "LEVEL "+level+" COMPLETE! 🎉",
     "Get ready for Level "+(level+1)
   );
 }
}


// =====================================================
// R
// =====================================================

function handleR(){

 if(gameOver||finished){

   level=1;
   lives=3;
   coins=0;
   score=0;

   gameOver=false;
   finished=false;

   loadLevel(1);
   return;
 }

 if(levelDone){

   level++;

   loadLevel(level);
 }
}


// =====================================================
// SCREEN
// =====================================================

function showScreen(title,message){

 document.getElementById("title").textContent=title;
 document.getElementById("message").textContent=message;
 document.getElementById("screen").style.display="flex";
}


function hideScreen(){

 document.getElementById("screen").style.display="none";
}


// =====================================================
// UI
// =====================================================

function updateUI(){

 document.getElementById("lives").textContent=lives;
 document.getElementById("coins").textContent=coins;
 document.getElementById("score").textContent=score;
 document.getElementById("lvl").textContent=level;
 document.getElementById("power").textContent=power;
}


// =====================================================
// PARTICLES
// =====================================================

function burst(x,y,color){

 for(let i=0;i<12;i++){

   particles.push({
     x:x,
     y:y,
     vx:(Math.random()-.5)*6,
     vy:(Math.random()-.5)*6,
     life:30,
     color
   });
 }
}


function updateParticles(){

 for(let p of particles){

   p.x+=p.vx;
   p.y+=p.vy;
   p.life--;
 }
 
 particles=particles.filter(p=>p.life>0);
}


// =====================================================
// BACKGROUND
// =====================================================

function background(){

 ctx.fillStyle="#69c8ff";
 ctx.fillRect(0,0,canvas.width,canvas.height);


 // SUN

 ctx.fillStyle="#ffe45c";

 ctx.beginPath();
 ctx.arc(800,85,45,0,Math.PI*2);
 ctx.fill();


 // CLOUDS

 cloud(130-camera*.2,100);
 cloud(470-camera*.2,150);
 cloud(800-camera*.2,110);


 // HILLS

 ctx.fillStyle="#53b957";

 for(
   let x=-300;
   x<world.width;
   x+=300
 ){

   ctx.beginPath();

   ctx.moveTo(
     x-camera*.25,
     500
   );

   ctx.quadraticCurveTo(
     x+150-camera*.25,
     300,
     x+300-camera*.25,
     500
   );

   ctx.fill();
 }
}


function cloud(x,y){

 ctx.fillStyle="white";

 ctx.beginPath();

 ctx.arc(x,y,25,0,Math.PI*2);
 ctx.arc(x+30,y-10,32,0,Math.PI*2);
 ctx.arc(x+65,y,25,0,Math.PI*2);

 ctx.fill();

 ctx.fillRect(x,y,65,25);
}


// =====================================================
// DRAW PLATFORMS
// =====================================================

function drawPlatforms(){

 for(let p of world.platforms){

   let x=p.x-camera;

   ctx.fillStyle="#87502c";
   ctx.fillRect(x,p.y,p.w,p.h);

   ctx.fillStyle="#42a83d";
   ctx.fillRect(x,p.y,p.w,8);
 }


 for(let p of world.moving){

   let x=p.x-camera;

   ctx.fillStyle="#7d4a27";
   ctx.fillRect(x,p.y,p.w,p.h);

   ctx.fillStyle="#ffbf32";
   ctx.fillRect(x,p.y,p.w,5);
 }
}


// =====================================================
// LUCKY BLOCKS
// =====================================================

function drawBlocks(){

 for(let b of world.blocks){

   let x=b.x-camera;

   ctx.fillStyle=
     b.used?"#9b741c":"#ffc928";

   ctx.fillRect(
     x,
     b.y-b.bounce,
     b.w,
     b.h
   );

   ctx.strokeStyle="#9b6510";
   ctx.lineWidth=3;

   ctx.strokeRect(
     x,
     b.y-b.bounce,
     b.w,
     b.h
   );


   if(!b.used){

     ctx.fillStyle="white";

     ctx.font="bold 25px Arial";

     ctx.fillText(
       "?",
       x+10,
       b.y+27-b.bounce
     );
   }
 }
}


// =====================================================
// COINS
// =====================================================

function drawCoins(){

 for(let c of world.coins){

   if(c.taken)continue;

   let x=c.x-camera;

   ctx.fillStyle="#ffd92f";

   ctx.beginPath();

   ctx.arc(
     x,
     c.y,
     11,
     0,
     Math.PI*2
   );

   ctx.fill();

   ctx.fillStyle="#fff5a3";

   ctx.fillRect(
     x-3,
     c.y-7,
     3,
     14
   );
 }
}


// =====================================================
// POWERUPS
// =====================================================

function drawPowerups(){

 for(let p of world.powerups){

   if(!p.active)continue;

   let x=p.x-camera;

   let colors={
     MUSHROOM:"#e94343",
     STAR:"#ffe83d",
     SPEED:"#37e8ff",
     FIRE:"#ff7137",
     HEART:"#ff4c75"
   };

   ctx.fillStyle=colors[p.type];

   ctx.beginPath();
   ctx.arc(x,p.y,15,0,Math.PI*2);
   ctx.fill();


   ctx.fillStyle="white";
   ctx.font="bold 14px Arial";

   let symbol={
     MUSHROOM:"M",
     STAR:"★",
     SPEED:"S",
     FIRE:"F",
     HEART:"♥"
   }[p.type];

   ctx.fillText(
     symbol,
     x-6,
     p.y+5
   );
 }
}


// =====================================================
// PIPES
// =====================================================

function drawPipes(){

 for(let p of world.pipes){

   let x=p.x-camera;

   ctx.fillStyle="#22a93c";

   ctx.fillRect(
     x,
     p.y,
     p.w,
     p.h
   );

   ctx.fillStyle="#39d653";

   ctx.fillRect(
     x-5,
     p.y,
     p.w+10,
     12
   );
 }
}


// =====================================================
// SPRINGS
// =====================================================

function drawSprings(){

 for(let s of world.springs){

   let x=s.x-camera;

   ctx.fillStyle="#e43c45";

   ctx.fillRect(
     x,
     s.y,
     s.w,
     s.h
   );

   ctx.fillStyle="#fff";

   ctx.fillRect(
     x+5,
     s.y+5,
     s.w-10,
     5
   );
 }
}


// =====================================================
// ENEMIES
// =====================================================

function drawEnemies(){

 for(let e of world.enemies){

   if(!e.alive)continue;

   let x=e.x-camera;
   let y=e.y;


   // BODY

   ctx.fillStyle="#7c4325";

   ctx.beginPath();

   ctx.arc(
     x+16,
     y+20,
     17,
     0,
     Math.PI*2
   );

   ctx.fill();


   // HEAD

   ctx.fillStyle="#c96b32";

   ctx.beginPath();

   ctx.arc(
     x+16,
     y+12,
     15,
     0,
     Math.PI*2
   );

   ctx.fill();


   // EYES

   ctx.fillStyle="white";

   ctx.fillRect(x+7,y+8,7,9);
   ctx.fillRect(x+18,y+8,7,9);

   ctx.fillStyle="#111";

   ctx.fillRect(x+10,y+11,3,5);
   ctx.fillRect(x+21,y+11,3,5);


   // FEET

   ctx.fillStyle="#482719";

   ctx.fillRect(x,y+29,13,6);
   ctx.fillRect(x+19,y+29,13,6);
 }
}


// =====================================================
// FIREBALLS
// =====================================================

function drawFireballs(){

 for(let f of fireballs){

   ctx.fillStyle="#ff572f";

   ctx.beginPath();

   ctx.arc(
     f.x-camera,
     f.y,
     7,
     0,
     Math.PI*2
   );

   ctx.fill();
 }
}


// =====================================================
// PLAYER
// =====================================================

function drawPlayer(){

 if(
   player.invincible>0 &&
   Math.floor(player.invincible/5)%2==0
 )
   return;


 let x=player.x-camera;
 let y=player.y;


 // HAT

 ctx.fillStyle="#e53b3b";

 ctx.fillRect(
   x+3,
   y,
   27,
   10
 );


 // FACE

 ctx.fillStyle="#ffc48e";

 ctx.fillRect(
   x+6,
   y+9,
   22,
   18
 );


 // HAIR

 ctx.fillStyle="#43251b";

 ctx.fillRect(
   x+5,
   y+8,
   7,
   16
 );


 // EYE

 ctx.fillStyle="#111";

 ctx.fillRect(
   x+21,
   y+13,
   3,
   3
 );


 // BODY

 ctx.fillStyle="#e53b3b";

 ctx.fillRect(
   x+3,
   y+26,
   27,
   14
 );


 // OVERALLS

 ctx.fillStyle="#2768c7";

 ctx.fillRect(
   x+8,
   y+25,
   16,
   16
 );


 // SHOES

 ctx.fillStyle="#4b291c";

 ctx.fillRect(
   x,
   y+39,
   13,
   7
 );

 ctx.fillRect(
   x+19,
   y+39,
   13,
   7
 );


 // STAR EFFECT

 if(power=="STAR"){

   ctx.strokeStyle=
     ["#fff","#ffe43b","#62e9ff"]
     [Math.floor(Date.now()/100)%3];

   ctx.lineWidth=4;

   ctx.strokeRect(
     x-4,y-4,
     player.w+8,
     player.h+8
   );
 }
}


// =====================================================
// GOAL
// =====================================================

function drawGoal(){

 let x=world.goal-camera;

 ctx.fillStyle="#ddd";

 ctx.fillRect(
   x,
   300,
   6,
   200
 );


 ctx.fillStyle="#ffdf3f";

 ctx.beginPath();

 ctx.moveTo(x+6,300);
 ctx.lineTo(x+60,320);
 ctx.lineTo(x+6,340);

 ctx.fill();
}


// =====================================================
// PARTICLES
// =====================================================

function drawParticles(){

 for(let p of particles){

   ctx.fillStyle=p.color;

   ctx.fillRect(
     p.x-camera,
     p.y,
     5,
     5
   );
 }
}


// =====================================================
// DRAW
// =====================================================

function draw(){

 background();

 drawPlatforms();

 drawPipes();

 drawSprings();

 drawBlocks();

 drawCoins();

 drawPowerups();

 drawEnemies();

 drawFireballs();

 drawGoal();

 drawParticles();

 drawPlayer();
}


// =====================================================
// START
// =====================================================

loadLevel(1);

function loop(){

 update();
 draw();

 requestAnimationFrame(loop);
}

loop();

</script>
